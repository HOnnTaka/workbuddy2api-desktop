[package]
name = "wb2api-panel-desktop"
version = "1.11.1"
description = "WorkBuddy2API Panel 桌面端管理工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "process"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
open = "5"

[profile.release]
strip = true
lto = true
opt-level = 3
